<!DOCTYPE html>
<html lang="zh" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RayScan 1.0.2 — Web Vulnerability Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* ── 共享基础样式 ── */
        body { font-family: 'Segoe UI', system-ui, sans-serif; }
        .card { border-radius: 8px; }
        .card-header { font-weight: 600; }
        #log-area {
            font-family: 'Cascadia Code', 'Consolas', monospace;
            font-size: 12px; height: 250px; overflow-y: auto; padding: 10px;
            border-radius: 6px; white-space: pre-wrap; word-break: break-all;
            line-height: 1.5;
        }
        .stat-label { font-size: 0.8rem; }
        .stat-value { font-family: 'Consolas', monospace; font-size: 1.1rem; font-weight: 600; }
        #progress-bar { height: 6px; border-radius: 3px; overflow: hidden; }
        #progress-bar .progress-bar { transition: width 0.3s; }
        .table { font-size: 0.85rem; }
        .form-check-label { font-size: 0.85rem; }
        .severity-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; font-weight: 600; }

        /* ── 深色主题 ── */
        [data-bs-theme="dark"] body { background: #0f1419; color: #e1e4e8; }
        [data-bs-theme="dark"] #main-navbar { background: #161b22; border-bottom: 1px solid #30363d; }
        [data-bs-theme="dark"] .card { background: #161b22; border: 1px solid #30363d; }
        [data-bs-theme="dark"] .card-header { background: #1c2333; border-bottom: 1px solid #30363d; }
        [data-bs-theme="dark"] .form-control, [data-bs-theme="dark"] .form-select { background: #0d1117; border: 1px solid #30363d; color: #e1e4e8; }
        [data-bs-theme="dark"] .form-control:focus, [data-bs-theme="dark"] .form-select:focus { background: #0d1117; border-color: #58a6ff; box-shadow: 0 0 0 2px rgba(88,166,255,0.2); }
        [data-bs-theme="dark"] #log-area { background: #0d1117; color: #e1e4e8; border: 1px solid #30363d; }
        [data-bs-theme="dark"] .log-info { color: #3fb950; }
        [data-bs-theme="dark"] .log-warning { color: #d29922; }
        [data-bs-theme="dark"] .log-error { color: #f85149; }
        [data-bs-theme="dark"] .stat-label { color: #8b949e; }
        [data-bs-theme="dark"] .stat-value { color: #58a6ff; }
        [data-bs-theme="dark"] #progress-bar { background: #21262d; }
        [data-bs-theme="dark"] #progress-bar .progress-bar { background: #2ea043; }
        [data-bs-theme="dark"] .table th { border-color: #30363d; color: #8b949e; }
        [data-bs-theme="dark"] .table td { border-color: #21262d; }
        [data-bs-theme="dark"] #results-table tbody tr:hover { background: #1c2333; }

        /* ── 浅色主题 ── */
        [data-bs-theme="light"] body { background: #f5f5f5; color: #212529; }
        [data-bs-theme="light"] #main-navbar { background: #f8f9fa; border-bottom: 1px solid #dee2e6; }
        [data-bs-theme="light"] .card { background: #ffffff; border: 1px solid #dee2e6; }
        [data-bs-theme="light"] .card-header { background: #f8f9fa; border-bottom: 1px solid #dee2e6; }
        [data-bs-theme="light"] .form-control, [data-bs-theme="light"] .form-select { background: #ffffff; border: 1px solid #ced4da; color: #212529; }
        [data-bs-theme="light"] .form-control:focus, [data-bs-theme="light"] .form-select:focus { background: #ffffff; border-color: #86b7fe; box-shadow: 0 0 0 2px rgba(13,110,253,0.2); }
        [data-bs-theme="light"] #log-area { background: #f8f9fa; color: #212529; border: 1px solid #dee2e6; }
        [data-bs-theme="light"] .log-info { color: #198754; }
        [data-bs-theme="light"] .log-warning { color: #a16207; }
        [data-bs-theme="light"] .log-error { color: #dc3545; }
        [data-bs-theme="light"] .stat-label { color: #6c757d; }
        [data-bs-theme="light"] .stat-value { color: #0d6efd; }
        [data-bs-theme="light"] #progress-bar { background: #e9ecef; }
        [data-bs-theme="light"] #progress-bar .progress-bar { background: #198754; }
        [data-bs-theme="light"] .table th { border-color: #dee2e6; color: #6c757d; }
        [data-bs-theme="light"] .table td { border-color: #dee2e6; }
        [data-bs-theme="light"] #results-table tbody tr:hover { background: #f8f9fa; }

        .toast-container { z-index: 9999; }
        @media (max-width: 768px) {
            #log-area { height: 150px; font-size: 11px; }
            .stat-value { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar navbar-expand navbar-dark px-3 py-2" id="main-navbar">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
            <span style="color:#58a6ff;">RayScan</span>
            <small class="text-secondary ms-2" style="font-size:0.7rem;">1.0.2</small>
        </span>
        <div class="d-flex align-items-center gap-3">
            <span id="vuln-badge" class="badge bg-secondary">漏洞: 0</span>
            <div class="form-check form-switch mb-0">
                <input class="form-check-input" type="checkbox" id="themeSwitch" checked
                       onchange="toggleTheme()">
                <label class="form-check-label" for="themeSwitch" style="font-size:0.8rem;">🌙</label>
            </div>
        </div>
    </div>
</nav>

<div class="container-fluid px-3 py-3">
    <div class="row g-3">

        <!-- 左侧配置面板 -->
        <div class="col-12 col-md-3">
            <div class="card mb-3">
                <div class="card-header py-2">检测模块</div>
                <div class="card-body py-2" id="module-list">
                    <div class="row" id="modules-container"></div>
                    <div class="mt-2">
                        <button class="btn btn-sm btn-outline-secondary me-1" onclick="toggleAll(true)">全选</button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="toggleAll(false)">取消</button>
                    </div>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-header py-2">扫描配置</div>
                <div class="card-body py-2">
                    <div class="mb-2"><label class="stat-label">速率 (req/s)</label>
                        <input class="form-control form-control-sm" id="cfg-rate" value="15"></div>
                    <div class="mb-2"><label class="stat-label">超时 (秒)</label>
                        <input class="form-control form-control-sm" id="cfg-timeout" value="15"></div>
                    <div class="mb-2"><label class="stat-label">爬虫深度</label>
                        <input class="form-control form-control-sm" id="cfg-depth" value="2"></div>
                    <div class="mb-2"><label class="stat-label">最大 URL</label>
                        <input class="form-control form-control-sm" id="cfg-urls" value="50"></div>
                    <div class="mb-2"><label class="stat-label">并发端点</label>
                        <input class="form-control form-control-sm" id="cfg-concurrent" value="10"></div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="cfg-insecure">
                        <label class="form-check-label" for="cfg-insecure">跳过 SSL 验证</label>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header py-2">信息</div>
                <div class="card-body py-2">
                    <div class="stat-label">RayScan 1.0.2</div>
                    <div class="stat-label" style="font-size:0.7rem;">MIT License</div>
                    <div class="stat-label" style="font-size:0.7rem;">
                        <a href="https://github.com/xiabai2004/RayScan" class="text-secondary">github.com/xiabai2004</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧主区域 -->
        <div class="col-12 col-md-9">
            <!-- URL 输入 -->
            <div class="card mb-3">
                <div class="card-body py-2">
                    <div class="row g-2 align-items-center">
                        <div class="col-12 col-sm">
                            <input class="form-control" id="url-input" placeholder="http://目标地址"
                                   style="font-family:'Consolas',monospace;font-size:1rem;"
                                   value="http://192.168.18.131">
                        </div>
                        <div class="col-6 col-sm-auto">
                            <button class="btn btn-primary w-100" id="btn-start" onclick="startScan()">
                                ▶ 开始扫描
                            </button>
                        </div>
                        <div class="col-6 col-sm-auto">
                            <button class="btn btn-danger w-100" id="btn-stop" onclick="stopScan()" disabled>
                                ■ 停止
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 进度条 -->
            <div class="card mb-3">
                <div class="card-body py-2">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span id="status-text" class="text-secondary" style="font-size:0.9rem;">就绪 ✓ 输入目标后点击开始</span>
                        <span id="module-text" class="text-info" style="font-family:Consolas;font-size:0.85rem;"></span>
                    </div>
                    <div id="progress-bar" class="mb-2">
                        <div class="progress-bar" id="progress-fill" style="width:0%"></div>
                    </div>
                    <div class="row text-center">
                        <div class="col-3"><div class="stat-label">端点</div><div class="stat-value" id="stat-endpoints">0</div></div>
                        <div class="col-3"><div class="stat-label">请求</div><div class="stat-value" id="stat-requests">0</div></div>
                        <div class="col-3"><div class="stat-label">用时</div><div class="stat-value" id="stat-time">0s</div></div>
                        <div class="col-3"><div class="stat-label">动作</div><div class="stat-value" id="stat-action" style="font-size:0.8rem;color:#8b949e;">-</div></div>
                    </div>
                </div>
            </div>

            <!-- 实时日志 -->
            <div class="card mb-3">
                <div class="card-header py-2 d-flex justify-content-between">
                    <span>实时扫描日志</span>
                    <span class="text-secondary" style="font-size:0.7rem;cursor:pointer;" onclick="clearLog()">清空</span>
                </div>
                <div class="card-body py-1">
                    <div id="log-area"></div>
                </div>
            </div>

            <!-- 结果表格 -->
            <div class="card mb-3">
                <div class="card-header py-2 d-flex justify-content-between align-items-center">
                    <span>发现结果（实时更新）</span>
                    <div>
                        <button class="btn btn-sm btn-outline-secondary me-1" onclick="exportJSON()">📥 JSON</button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="clearResults()">🗑 清空</button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div style="overflow-x:auto;">
                        <table class="table table-dark table-hover mb-0" id="results-table">
                            <thead>
                                <tr><th style="width:70px">严重度</th><th style="width:100px">类型</th><th>URL</th><th style="width:80px">参数</th><th>证据</th></tr>
                            </thead>
                            <tbody id="results-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ── 模块列表 ──
const MODULES = {
    "sqli": "SQL注入", "xss": "XSS", "cmdi": "命令注入",
    "lfi": "LFI", "rce": "RCE", "ssrf": "SSRF", "xxe": "XXE",
    "api": "API安全", "sensitive": "敏感信息", "waf": "WAF检测",
};
const MODULE_COLS = 2;

function initModules() {
    const container = document.getElementById('modules-container');
    let cols = [];
    const keys = Object.keys(MODULES);
    for (let i = 0; i < Math.min(MODULE_COLS, keys.length); i++) {
        cols[i] = document.createElement('div');
        cols[i].className = 'col-6';
    }
    keys.forEach((key, idx) => {
        const col = cols[idx % MODULE_COLS];
        const div = document.createElement('div');
        div.className = 'form-check';
        div.innerHTML = `<input class="form-check-input module-cb" type="checkbox" id="mod-${key}" checked>
                         <label class="form-check-label" for="mod-${key}">${MODULES[key]}</label>`;
        col.appendChild(div);
    });
    cols.forEach(c => container.appendChild(c));
}
initModules();

function toggleAll(state) {
    document.querySelectorAll('.module-cb').forEach(cb => cb.checked = state);
}

// ── 主题切换 ──
function toggleTheme() {
    const dark = document.getElementById('themeSwitch').checked;
    const theme = dark ? 'dark' : 'light';
    document.documentElement.setAttribute('data-bs-theme', theme);
    // 切换标签文字
    document.getElementById('themeSwitch').nextElementSibling.textContent = dark ? '🌙' : '☀️';
    // 同步 navbar 颜色（Bootstrap 类切换）
    const nav = document.getElementById('main-navbar');
    nav.classList.toggle('navbar-dark', dark);
    nav.classList.toggle('navbar-light', !dark);
}

// ── SSE 连接 ──
let eventSource = null;
let scanning = false;

function startScan() {
    const url = document.getElementById('url-input').value.trim();
    if (!url || url === 'http://') { alert('请输入目标 URL'); return; }

    const modules = [];
    document.querySelectorAll('.module-cb:checked').forEach(cb => {
        modules.push(cb.id.replace('mod-', ''));
    });
    if (modules.length === 0) { alert('至少选择一个模块'); return; }

    document.getElementById('btn-start').disabled = true;
    document.getElementById('btn-stop').disabled = false;
    document.getElementById('results-body').innerHTML = '';
    document.getElementById('log-area').innerHTML = '';
    document.getElementById('progress-fill').style.width = '0%';
    ['stat-endpoints','stat-requests'].forEach(id => document.getElementById(id).textContent = '0');
    document.getElementById('stat-time').textContent = '0s';
    scanning = true;

    // 连接 SSE
    if (eventSource) eventSource.close();
    eventSource = new EventSource('/api/stream');

    eventSource.addEventListener('log', e => {
        const d = JSON.parse(e.data);
        appendLog(d.time, d.level, d.text);
    });

    eventSource.addEventListener('progress', e => {
        const d = JSON.parse(e.data);
        document.getElementById('progress-fill').style.width = Math.min(d.pct, 100) + '%';
    });

    eventSource.addEventListener('action', e => {
        const d = JSON.parse(e.data);
        document.getElementById('module-text').textContent = d.text || '';
        document.getElementById('stat-action').textContent = d.text || '-';
    });

    eventSource.addEventListener('result', e => {
        const d = JSON.parse(e.data);
        if (d.stats) {
            document.getElementById('stat-endpoints').textContent = d.stats.endpoints || '0';
            document.getElementById('stat-requests').textContent = d.stats.requests || '0';
            document.getElementById('stat-time').textContent = (d.stats.elapsed || 0) + 's';
        }
        if (d.vulnerabilities) {
            d.vulnerabilities.forEach(v => addResultRow(v));
        }
    });

    eventSource.addEventListener('done', e => {
        onScanDone();
    });

    eventSource.onerror = () => {
        // 自动重连
    };

    // POST 启动
    fetch('/api/scan', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            url: url,
            modules: modules,
            rate: parseInt(document.getElementById('cfg-rate').value) || 15,
            timeout: parseInt(document.getElementById('cfg-timeout').value) || 15,
            crawl_depth: parseInt(document.getElementById('cfg-depth').value) || 2,
            crawl_max_urls: parseInt(document.getElementById('cfg-urls').value) || 50,
            concurrent_endpoints: parseInt(document.getElementById('cfg-concurrent').value) || 10,
            insecure: document.getElementById('cfg-insecure').checked,
        }),
    }).then(r => r.json()).then(d => {
        if (d.error) {
            appendLog('--', 'ERROR', d.error);
            onScanDone();
        } else {
            appendLog('--', 'INFO', '扫描任务已启动');
            document.getElementById('status-text').textContent = '扫描进行中...';
            document.getElementById('status-text').className = 'text-info';
        }
    });
}

function stopScan() {
    fetch('/api/stop', {method: 'POST'});
    appendLog('--', 'WARNING', '用户中止扫描');
    onScanDone();
}

function onScanDone() {
    scanning = false;
    document.getElementById('btn-start').disabled = false;
    document.getElementById('btn-stop').disabled = true;
    document.getElementById('status-text').textContent = '就绪 ✓ 扫描完成';
    document.getElementById('status-text').className = 'text-secondary';
    if (eventSource) { eventSource.close(); eventSource = null; }
}

// ── 日志 ──
function appendLog(time, level, text) {
    const area = document.getElementById('log-area');
    const d = document.createElement('div');
    const cls = level === 'ERROR' ? 'log-error' : level === 'WARNING' ? 'log-warning' : 'log-info';
    d.innerHTML = `<span style="color:#8b949e">${time}</span> <span class="${cls}">${escapeHtml(text)}</span>`;
    area.appendChild(d);
    area.scrollTop = area.scrollHeight;
}

function clearLog() {
    document.getElementById('log-area').innerHTML = '';
}

// ── 结果 ──
function addResultRow(v) {
    const tbody = document.getElementById('results-body');
    const sev = (v.severity || 'info').toLowerCase();
    const badgeCls = `badge-${sev}`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td><span class="severity-badge ${badgeCls}">${sev.toUpperCase()}</span></td>
        <td>${escapeHtml(v.type || '')}</td>
        <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(v.url || '')}</td>
        <td>${escapeHtml(v.parameter || '')}</td>
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(v.evidence || '')}</td>
    `;
    tbody.appendChild(tr);

    // 更新计数
    const rows = tbody.querySelectorAll('tr').length;
    document.getElementById('vuln-badge').textContent = `漏洞: ${rows}`;
    document.getElementById('vuln-badge').className = rows > 0 ? 'badge bg-danger' : 'badge bg-secondary';
}

function clearResults() {
    document.getElementById('results-body').innerHTML = '';
    document.getElementById('vuln-badge').textContent = '漏洞: 0';
    document.getElementById('vuln-badge').className = 'badge bg-secondary';
}

// ── 导出 ──
function exportJSON() {
    fetch('/api/export/json').then(r => {
        if (!r.ok) throw new Error('无结果');
        return r.json();
    }).then(data => {
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `rayscan_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }).catch(e => alert('没有结果可导出'));
}

// ── 工具 ──
function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// 定时刷新用时
setInterval(() => {
    if (scanning) {
        const el = document.getElementById('stat-time');
        const cur = parseFloat(el.textContent) || 0;
        el.textContent = (cur + 1).toFixed(0) + 's';
    }
}, 1000);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
