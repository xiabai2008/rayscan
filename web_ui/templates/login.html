<!DOCTYPE html>
<html lang="zh" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RayScan — 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0f1419; color: #e1e4e8;
            min-height: 100vh; display: flex; align-items: center;
            justify-content: center; font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .login-card {
            max-width: 420px; width: 100%;
            background: #161b22; border: 1px solid #30363d; border-radius: 8px;
            padding: 32px;
        }
        h1 { font-size: 1.4rem; margin-bottom: 8px; }
        .lead { color: #8b949e; font-size: 0.9rem; margin-bottom: 24px; }
        code { color: #58a6ff; background: #0d1117; padding: 2px 6px; border-radius: 4px; }
        .form-control { background: #0d1117; border: 1px solid #30363d; color: #e1e4e8; }
        .form-control:focus { background: #0d1117; color: #e1e4e8; border-color: #58a6ff; box-shadow: 0 0 0 2px rgba(88,166,255,0.2); }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🔬 RayScan Web UI</h1>
        <p class="lead">输入 API token 以继续。token 在启动日志中打印，
        可通过 <code>RAYSCAN_WEB_TOKEN</code> 环境变量预设。</p>
        {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="mb-3">
                <label for="token" class="form-label">API Token</label>
                <input type="password" class="form-control" id="token" name="token" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100">登录</button>
        </form>
    </div>
</body>
</html>
