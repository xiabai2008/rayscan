# WVS 扫描配置文件示例

# 扫描目标
target: http://example.com

# 扫描策略
scan:
  # 端口范围
  port_range: [1, 1000]
  
  # 爬虫配置
  max_depth: 3
  max_urls: 100
  
  # 并发配置
  concurrency: 50
  timeout: 10.0
  
  # 检测模块
  modules:
    xss: true
    sqli: true
    info: true
    traversal: true
  
  # POC 验证
  verify_poc: false
  
  # 过滤配置
  min_confidence: 0.5
  deduplicate: true

# 认证配置 (可选)
# auth:
#   type: cookie  # cookie, bearer, basic
#   value: sessionid=abc123

# 输出配置
output:
  dir: reports
  formats: [html, json, csv]
