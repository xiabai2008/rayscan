[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rayscan"
version = "2.0.0"
description = "RayScan — 开箱即用的 Web 漏洞扫描器 | SQLi/XSS/命令注入/LFI/SSRF/XXE/RCE/API安全 | 多引擎聚合(Nuclei/sqlmap/ffuf)+MSF验证链+Profile扫描配置 | CLI+Web UI双模式"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "xiabai2004"}
]
keywords = ["web-security", "vulnerability-scanner", "penetration-testing", "sql-injection", "xss", "security", "bug-bounty", "metasploitable", "dvwa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Security :: Vulnerability",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "pyyaml>=6.0",
    "colorama>=0.4.0",
    "aiohttp>=3.8.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pre-commit>=3.0.0",
    "types-requests",
    "types-PyYAML",
]
speedup = [
    "orjson>=3.8.0",
    "uvloop>=0.17.0",
]
nuclei = [
    "nuclei-python>=0.1.0",
]
integrations = [
    "python-Wappalyzer>=1.2.0",
    "aiohttp>=3.8.0",
]
gui = [
    "ttkbootstrap>=1.20.0",
]
web = [
    "flask>=3.0",
]

[project.scripts]
wvs = "wvs.cli:main"
rayscan = "wvs.cli:main"

[project.urls]
Homepage = "https://github.com/xiabai2004/RayScan"
Repository = "https://github.com/xiabai2004/RayScan"
Issues = "https://github.com/xiabai2004/RayScan/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["wvs*"]
exclude = ["tests*", "docs*", "examples*"]

# 单一格式化器 = ruff-format（不再使用 black/isort，避免行宽/风格冲突）
[tool.ruff]
line-length = 120
target-version = "py38"
lint.select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort — 导入排序
    "B",    # flake8-bugbear — 常见 bug 模式
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade — 现代语法
    "SIM",  # flake8-simplify
    "BLE",  # 裸/盲目 except
    "TRY",  # try-except 最佳实践
    "S110", # 静默 suppress 未记录
    "ARG",  # 未使用参数
    "PTH",  # pathlib 优于 os.path
    "RUF",  # ruff 自带检查
]
lint.ignore = [
    "E501",  # 行长度由 ruff-format 统一处理
    # 以下为 CJK 项目误报：中文注释/文档中大量使用 → — ✅ 等 intentional 符号
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
]
# 历史遗留的载荷数据文件：暂整体排除，列入技术债逐步整改
lint.exclude = [
    "wvs/modules/sqli/payloads.py",
    "wvs/modules/sqli/techniques_mixins.py",
    "wvs/modules/rce/payloads.py",
]

[tool.ruff.lint.per-file-ignores]
"wvs/exceptions.py" = ["TRY", "BLE", "S110"]
"wvs/modules/base.py" = ["TRY", "BLE"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
no_implicit_optional = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "wvs.tests.*",
    "wvs.modules.sqli.payloads",
    "wvs.modules.sqli.techniques_mixins",
    "wvs.modules.rce.payloads",
    "wvs.core.crawler_parsers",
    "wvs.core.scanner_integrations",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
