[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rayscan"
version = "1.0.2"
description = "RayScan — 开箱即用的 Web 漏洞扫描器 | SQL注入 / XSS / 命令注入 / LFI / SSRF / XXE / RCE / API安全 | CLI + Web UI 双模式"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "xiabai2004"}
]
keywords = ["web-security", "vulnerability-scanner", "penetration-testing", "sql-injection", "xss", "security", "bug-bounty", "metasploitable", "dvwa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Security :: Vulnerability",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",
    "pyyaml>=6.0",
    "colorama>=0.4.0",
    "aiohttp>=3.8.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pre-commit>=3.0.0",
    "types-requests",
    "types-PyYAML",
]
speedup = [
    "orjson>=3.8.0",
    "uvloop>=0.17.0",
]
nuclei = [
    "nuclei-python>=0.1.0",
]
integrations = [
    "python-Wappalyzer>=1.2.0",
    "aiohttp>=3.8.0",
]
gui = [
    "ttkbootstrap>=1.20.0",
]
web = [
    "flask>=3.0",
]

[project.scripts]
wvs = "wvs.cli:main"
rayscan = "wvs.cli:main"

[project.urls]
Homepage = "https://github.com/xiabai2004/RayScan"
Repository = "https://github.com/xiabai2004/RayScan"
Issues = "https://github.com/xiabai2004/RayScan/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["wvs*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_sort_within_sections = true
known_first_party = ["wvs"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
# Relaxed for now — too many legacy signatures use `x: str = None`
no_implicit_optional = false
# Relaxed — many functions lack full annotations
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "wvs.tests.*",
    "wvs.modules.sqli.payloads",
    "wvs.modules.sqli.techniques_mixins",
    "wvs.modules.rce.payloads",
    "wvs.core.crawler_parsers",
    "wvs.core.scanner_integrations",
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
