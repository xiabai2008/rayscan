name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'images/**'
      - 'docs/**'
  pull_request:
    branches: [master, main]
  # 手动触发（Benchmark 回归门禁等）：gh workflow run ci.yml 或 Actions 页面 Run workflow
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (coverage gate, blocking)
        # T4 (TD-006): fail_under 门槛在 pyproject.toml [tool.coverage.report]
        run: pytest tests/ -q --cov=wvs --cov-report=term-missing --tb=short

      - name: Test import
        run: python -c "from wvs.core import WAVScanner, HTTPPool; print('✅ Import OK')"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install "ruff==0.15.21"
      - name: ruff check
        # T4: select/ignore 已统一进 pyproject.toml（本地 = CI），此处不再命令行覆盖
        run: ruff check wvs/ tests/

  format:
    name: Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install "ruff==0.15.21"
      - name: ruff format check
        run: ruff format --check wvs/ tests/

  types:
    name: Types (mypy, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: mypy new modules (advisory, non-blocking)
        # T4 (TD-003/007): 新增模块全量注解收口；存量模块 mypy 债务渐进整改（见 TECH_DEBT）
        run: mypy wvs/ai wvs/mcp_server.py wvs/modules/mcp wvs/modules/graphql --ignore-missing-imports || true

  benchmark:
    name: Benchmark (regression gate)
    runs-on: ubuntu-latest
    # 手动触发（发版前/怀疑回归时）：gh workflow run ci.yml -f 或 Actions 页面 Run workflow
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run benchmark regression
        run: python scripts/run_benchmark.py --port 18099
