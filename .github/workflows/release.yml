name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate changelog
        id: changelog
        run: |
          echo "### 下载" > release_notes.md
          echo "" >> release_notes.md
          echo "请从下方 Assets 下载对应平台的安装包。" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          cat CHANGELOG.md | head -50 >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: RayScan ${{ github.ref_name }}
          body_path: release_notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
