name: Docker

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (verify Dockerfile)
        # 仓库当前未配置 DockerHub 凭据，故仅构建验证、不推送，避免登录失败导致 workflow 红灯。
        # 需要自动推送镜像时：在仓库 Settings > Secrets 配置 DOCKER_USERNAME / DOCKER_PASSWORD，
        # 并恢复 docker/login-action 步骤与 push 条件。
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: xiabai2008/rayscan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
