name: 💡 功能建议
description: 为 RayScan 提一个新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        你的建议对我们很重要！请描述你想看到的功能。
  - type: textarea
    id: problem
    attributes:
      label: 解决了什么问题
      description: 你在使用中遇到了什么限制或痛点？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你期望的方案
      description: 描述你希望看到的功能或改进
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 有没有考虑过其他实现方式？
  - type: checkboxes
    id: willing
    attributes:
      label: 是否愿意参与实现
      options:
        - label: 我愿意提交 PR 实现这个功能
